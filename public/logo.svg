<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tic-Tac-Toe">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <line x1="22" y1="8" x2="22" y2="56"/>
    <line x1="42" y1="8" x2="42" y2="56"/>
    <line x1="8" y1="22" x2="56" y2="22"/>
    <line x1="8" y1="42" x2="56" y2="42"/>
  </g>
  <!-- O top-left -->
  <circle cx="12" cy="12" r="5.5" fill="none" stroke="#ef4444" stroke-width="2.6"/>
  <!-- X center -->
  <g stroke="#1e293b" stroke-width="3" stroke-linecap="round">
    <line x1="27" y1="27" x2="37" y2="37"/>
    <line x1="37" y1="27" x2="27" y2="37"/>
  </g>
  <!-- O bottom-right -->
  <circle cx="52" cy="52" r="5.5" fill="none" stroke="#ef4444" stroke-width="2.6"/>
</svg>
